apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-facing-portal-stable
  namespace: ai-platform
  labels: &customerFacingStableLabels
    app.kubernetes.io/name: customer-facing-portal
    app.kubernetes.io/component: web
    release-track: stable
spec:
  replicas: 2
  selector:
    matchLabels: *customerFacingStableLabels
  template:
    metadata:
      labels: *customerFacingStableLabels
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      containers:
        - name: app
          image: ${IMAGE_REGISTRY}/customer-facing-portal:stable
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-facing-portal-canary
  namespace: ai-platform
  labels: &customerFacingCanaryLabels
    app.kubernetes.io/name: customer-facing-portal
    app.kubernetes.io/component: web
    release-track: canary
spec:
  replicas: 0
  selector:
    matchLabels: *customerFacingCanaryLabels
  template:
    metadata:
      labels: *customerFacingCanaryLabels
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
    spec:
      containers:
        - name: app
          image: ${IMAGE_REGISTRY}/customer-facing-portal:canary
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: customer-facing-portal-stable
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: customer-facing-portal
    release-track: stable
spec:
  selector:
    app.kubernetes.io/name: customer-facing-portal
    release-track: stable
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: customer-facing-portal-canary
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: customer-facing-portal
    release-track: canary
spec:
  selector:
    app.kubernetes.io/name: customer-facing-portal
    release-track: canary
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-facing-portal-stable
  namespace: ai-platform
spec:
  ingressClassName: nginx
  rules:
    - host: customer-facing-portal.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-facing-portal-stable
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-facing-portal-canary
  namespace: ai-platform
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: customer-facing-portal.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-facing-portal-canary
                port:
                  number: 80
---
