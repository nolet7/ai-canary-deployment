apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-anomaly-exporter
  namespace: ai-platform
data:
  exporter.py: |
    import json
    import os
    import time
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PROMETHEUS_URL = os.getenv(
        "PROMETHEUS_URL",
        "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090",
    ).rstrip("/")

    QUERIES = {
        "unavailable_replicas": 'sum(kube_deployment_status_replicas_unavailable{namespace="ai-platform"})',
        "pod_restarts_5m": 'sum(increase(kube_pod_container_status_restarts_total{namespace="ai-platform"}[5m]))',
        "nginx_5xx_5m": 'sum(rate(nginx_ingress_controller_requests{exported_namespace="ai-platform",status=~"5.."}[5m]))',
        "nginx_p95_latency": 'histogram_quantile(0.95, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace="ai-platform"}[5m])) by (le))',
    }

    def prometheus_query(query):
        url = PROMETHEUS_URL + "/api/v1/query?" + urllib.parse.urlencode({"query": query})
        try:
            with urllib.request.urlopen(url, timeout=5) as response:
                payload = json.loads(response.read().decode("utf-8"))
            result = payload.get("data", {}).get("result", [])
            if not result:
                return 0.0
            return float(result[0]["value"][1])
        except Exception:
            return 0.0

    def clamp(value):
        return max(0.0, min(1.0, value))

    def score(metrics):
        restart_score = clamp(metrics["pod_restarts_5m"] / 3.0)
        unavailable_score = clamp(metrics["unavailable_replicas"] / 2.0)
        error_score = clamp(metrics["nginx_5xx_5m"] / 0.05)
        latency_score = clamp(metrics["nginx_p95_latency"] / 2.0)
        return clamp((restart_score * 0.30) + (unavailable_score * 0.35) + (error_score * 0.25) + (latency_score * 0.10))

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path not in ("/metrics", "/"):
                self.send_response(404)
                self.end_headers()
                return

            metrics = {name: prometheus_query(query) for name, query in QUERIES.items()}
            anomaly = score(metrics)
            lines = [
                "# HELP ai_release_anomaly_score Composite ML-style anomaly score for release health, 0 is normal and 1 is critical.",
                "# TYPE ai_release_anomaly_score gauge",
                f'ai_release_anomaly_score{{namespace="ai-platform"}} {anomaly:.4f}',
                "# HELP ai_release_signal_value Raw signal values used by the anomaly scorer.",
                "# TYPE ai_release_signal_value gauge",
            ]
            for name, value in metrics.items():
                lines.append(f'ai_release_signal_value{{signal="{name}"}} {value}')
            body = "\n".join(lines) + "\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.end_headers()
            self.wfile.write(body.encode("utf-8"))

        def log_message(self, fmt, *args):
            return

    HTTPServer(("0.0.0.0", 9108), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-anomaly-exporter
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-anomaly-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-anomaly-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-anomaly-exporter
    spec:
      containers:
        - name: exporter
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/exporter.py"]
          ports:
            - containerPort: 9108
              name: metrics
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: ai-anomaly-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: ai-anomaly-exporter
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-anomaly-exporter
spec:
  selector:
    app.kubernetes.io/name: ai-anomaly-exporter
  ports:
    - name: metrics
      port: 9108
      targetPort: 9108
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-anomaly-exporter
  namespace: ai-platform
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-anomaly-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s

