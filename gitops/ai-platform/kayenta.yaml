apiVersion: v1
kind: Namespace
metadata:
  name: kayenta
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kayenta
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kayenta-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kayenta-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kayenta
spec:
  selector:
    app.kubernetes.io/name: kayenta-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kayenta-config
  namespace: kayenta
data:
  kayenta.yml: |
    server:
      port: 8090
    kayenta:
      redis:
        enabled: true
        connection: redis://redis.kayenta.svc.cluster.local:6379
      prometheus:
        enabled: true
        accounts:
          - name: prometheus
            endpoint:
              baseUrl: http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090
            supportedTypes:
              - METRICS_STORE
      memory:
        enabled: true
    redis:
      enabled: true
      connection: redis://redis.kayenta.svc.cluster.local:6379
      clients:
        - name: executionRepository
          primary: true
          connection: redis://redis.kayenta.svc.cluster.local:6379
    executionRepository:
      redis:
        enabled: true
    services:
      fiat:
        enabled: false
      front50:
        enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kayenta
  namespace: kayenta
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kayenta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kayenta
    spec:
      containers:
        - name: kayenta
          image: sihouzhao/spinnaker:kayenta
          imagePullPolicy: IfNotPresent
          args:
            - /opt/kayenta/bin/kayenta
            - --spring.config.location=/opt/kayenta/config/kayenta.yml
          ports:
            - containerPort: 8090
          volumeMounts:
            - name: config
              mountPath: /opt/kayenta/config
      volumes:
        - name: config
          configMap:
            name: kayenta-config
---
apiVersion: v1
kind: Service
metadata:
  name: kayenta
  namespace: kayenta
spec:
  selector:
    app.kubernetes.io/name: kayenta
  ports:
    - name: http
      port: 8090
      targetPort: 8090

